[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "himari-x402-sidecar"
version = "0.2.0"
description = "Thin Python sidecar bridging the Rust bot (baibot, chums branch) + Flutter client to an x402 v2 facilitator (TRON exact/Permit2)."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Chums team" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.5",
    # EIP-712 digest + ecrecover for the ground-truth vector test only.
    "eth-account>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/himari_x402_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --tb=short"
