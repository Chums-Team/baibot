[package]
name = "baibot"
description = "A Matrix bot for using diffent capabilities (text-generation, text-to-speech, speech-to-text, image-generation, etc.) of AI / Large Language Models"
authors = ["Slavi Pantaleev <slavi@devture.com>"]
repository = "https://github.com/etkecc/baibot"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["matrix", "chat", "bot", "AI", "LLM"]
include = ["/etc/assets/baibot-torso-768.png", "/locales", "/src", "/README.md", "/CHANGELOG.md", "/LICENSE"]
version = "1.26.0"
edition = "2024"

[lib]
name = "baibot"
path = "src/lib.rs"

[features]
default = ["tron-login"]
# Logging in through a TRON wallet (see `src/tron_login`, docs/configuration/authentication.md).
# Pulls in the secp256k1 / keccak / BIP-32 crates; build with `--no-default-features` to leave
# them out.
tron-login = ["dep:k256", "dep:bip39", "dep:bip32", "dep:sha3", "dep:bs58"]

[dependencies]
anthropic = { git = "https://github.com/etkecc/anthropic-rs.git", branch = "fix-content-block-image" }
anyhow = "1.0.*"
async-openai = { version = "0.42.0", features = ["audio", "chat-completion", "image", "responses"] }
base64 = "0.23.*"
chrono = { version = "0.4.*", default-features = false, features = ["std", "now", "serde"] }
# We'd rather not depend on this, but we cannot use the ruma-events EventContent macro without it.
matrix-sdk = { version = "0.18.0", default-features = false }
mime_guess = "2.0.*"
mxidwc = "1.0.*"
mxlink = ">=1.15.0"
etke_openai_api_rust = "0.1.*"
quick_cache = "0.7.*"
regex = "1.13.*"
# HTTP client for the native `venice` provider. rustls only (no extra TLS stack), matching the
# reqwest copy async-openai/matrix-sdk/mxlink already use.
reqwest = { version = "0.13.*", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1.0.*", features = ["derive"], default-features = false }
serde_json = "1.0.*"
serde_yaml_ng = "0.10.*"
tempfile = "3.27.*"
tiktoken-rs = { version = "0.12.*", default-features = false }
tokio = { version = "1.53.*", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1.*"
tracing-subscriber = { version = "0.3.*", features = ["env-filter"] }
url = "2.5.*"

# Billing ledger (see `src/billing`).
# rusqlite is pinned to the version matrix-sdk-sqlite links against: `libsqlite3-sys`
# can only be linked once per binary.
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
thiserror = "1.0"
uuid = { version = "1.10", features = ["v7", "serde"] }

# x402 top-ups (see `src/x402`): the internal HTTP endpoint the payment sidecar notifies
# about settled payments, and the HMAC that authenticates those notifications.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

# Localized replies (see `src/i18n`): `locales/*.yml` are embedded at compile time.
rust-i18n = "4.2"

# TRON wallet login (feature `tron-login`, see `src/tron_login`). Pure Rust, no C libraries.
# Versions follow what the lockfile already carries (`digest`/`sha2` 0.10, `bs58` 0.5), so no
# second copy of those crates is linked; `bip32` 0.5 itself depends on `k256` 0.13.
# `bip39` (rust-bitcoin) parses the seed phrase: the mnemonic support of `bip32` takes 24-word
# phrases only, while wallets mostly hand out 12 words.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"], optional = true }
bip39 = { version = "2.2", default-features = false, features = ["std", "zeroize"], optional = true }
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"], optional = true }
sha3 = { version = "0.10", default-features = false, optional = true }
bs58 = { version = "0.5", default-features = false, features = ["std", "check"], optional = true }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[dev-dependencies]
# `net` for the TCP listener the tron_login challenge client is tested against.
tokio = { version = "1.53.*", features = ["time", "net"] }
# `oneshot` requests against the webhook router without a TCP listener.
tower = { version = "0.5", default-features = false, features = ["util"] }

# The ruma `EventContent` derive (used for `cc.chums.set_user_locale`) emits
# `#[cfg(ruma_unstable_exhaustive_types)]`, which rustc would otherwise flag as unexpected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ruma_unstable_exhaustive_types)"] }

[profile.release]
strip = true
opt-level = "z"
lto = "thin"
